<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,Arial,sans-serif}
  :root{
    --bg:#0c0c11;--card:#16161d;--text:#f1ece1;--muted:#9a948a;--line:#2b2b35;
    --blue:#d4af37;--blue-d:#b8912f;--dark:#0a0a0e;--green:#3ec46b;--red:#ff6b6b;
    --orange:#ff7a2f;--yellow:#ffbe3d;
  }
  body{background:var(--bg);color:var(--text)}
  /* premium top bar */
  .topbar{height:60px;background:linear-gradient(90deg,#b8912f,#d4af37,#e7c873);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}
  .topbar .tb-left{display:flex;align-items:center;gap:12px;font-weight:800;font-size:16px}
  .tb-badge{width:34px;height:34px;background:rgba(255,255,255,.18);border-radius:9px;display:grid;place-items:center;font-weight:900}
  .role-switch{display:flex;background:rgba(255,255,255,.16);border-radius:9px;padding:3px;gap:3px}
  .role-switch button{border:0;background:0;color:#efe2bf;padding:7px 16px;border-radius:7px;font-weight:800;font-size:13px;cursor:pointer}
  .role-switch button.active{background:#16161d;color:var(--blue)}
  .app{display:flex;min-height:calc(100vh - 60px)}
  /* sidebar */
  .sidebar{width:255px;background:#16161d;border-right:1px solid #2b2b35;display:flex;flex-direction:column;position:fixed;top:60px;bottom:0;left:0;z-index:10}
  .brand{height:70px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line)}
  .brand-icon{width:38px;height:38px;border-radius:11px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden}
  .brand-icon img{width:100%;height:100%;object-fit:cover}
  .brand h3{font-size:15px}
  .nav{padding:10px;overflow:auto;flex:1}
  .group-title{font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#8d877c;padding:14px 10px 6px}
  .nav-link{display:flex;align-items:center;gap:10px;padding:11px 12px;color:#3c4656;border-radius:9px;font-size:13.5px;cursor:pointer;margin:2px 0;font-weight:600}
  .nav-link .ic{width:7px;height:7px;border-radius:50%;background:#55514a;flex:none}
  .nav-link:hover{background:#1e1e27}
  .nav-link.active{background:#1e1e27;color:var(--blue);font-weight:800}
  .nav-link.active .ic{background:var(--blue)}
  .nav-link .badge{margin-left:auto;background:var(--blue);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:2px 8px}
  .bottom-actions{padding:14px;border-top:1px solid var(--line)}
  .logout{background:#241416;color:#ff3b3b;border:1px solid #3a2424;border-radius:9px;padding:12px;width:100%;font-size:13.5px;font-weight:700;cursor:pointer}
  /* main */
  .main{margin-left:255px;width:calc(100% - 255px);padding:22px}
  .top-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:14px;flex-wrap:wrap}
  .top-head h1{font-size:28px;margin-bottom:4px}.top-head p{color:#6b7280;font-size:13px}
  .head-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{border:0;border-radius:9px;padding:11px 17px;font-weight:800;cursor:pointer;font-size:13px}
  .btn.dark{background:#0a0a0e;color:#fff}.btn.blue{background:var(--blue);color:#fff}
  .btn.green{background:var(--green);color:#fff}.btn.light{background:#16161d;border:1px solid #2b2b35;color:#374151}
  .btn:active{transform:scale(.97)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .stat{background:#16161d;border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:0 4px 14px rgba(20,30,60,.04)}
  .stat small{color:#8691a5;font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.04em}
  .stat h2{font-size:27px;margin-top:7px}
  .stat .trend{font-size:11px;font-weight:700;margin-top:4px}
  .mini-card{border:1px solid var(--line);border-radius:10px;padding:12px;background:#1e1e27}.mini-card small{display:block;color:var(--muted);font-weight:900;text-transform:uppercase;font-size:10px}.mini-card b{font-size:18px}
  .up{color:var(--green)}.down{color:var(--red)}
  .pos-grid{display:grid;grid-template-columns:340px 1fr 410px;gap:16px;align-items:start}
  .panel{background:#16161d;border:1px solid var(--line);border-radius:13px;box-shadow:0 4px 14px rgba(20,30,60,.04);overflow:hidden}
  .panel-head{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .panel-head h3{font-size:16px}
  .tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);padding:0 16px}
  .tab{padding:13px 0;font-size:12px;font-weight:900;color:#7f8ca3;cursor:pointer;border-bottom:3px solid transparent;letter-spacing:.03em}
  .tab.active{color:var(--blue);border-color:var(--blue)}
  .filters{padding:13px;display:grid;gap:9px}
  .input{width:100%;padding:11px 12px;border:1px solid #2b2b35;border-radius:9px;background:#16161d;font-size:13px;outline:0}
  .input:focus{border-color:var(--blue)}
  .order-list{padding:0 13px 13px;display:grid;gap:9px;max-height:560px;overflow:auto}
  .order-card{border:1px solid var(--line);border-radius:11px;padding:14px;cursor:pointer;background:#16161d;transition:.12s}
  .order-card:hover{box-shadow:0 6px 18px rgba(20,30,60,.08)}
  .order-card.active{background:var(--blue-d);color:#fff;border-color:var(--blue-d)}
  .order-card .row{display:flex;justify-content:space-between;align-items:center}
  .dot{width:10px;height:10px;border-radius:50%;background:#2ec84d;display:inline-block;margin-right:8px}
  .order-title{font-size:17px;font-weight:900}
  .order-meta{display:flex;gap:14px;margin-top:12px;font-size:11.5px;color:#6b7280}
  .order-card.active .order-meta{color:#efe2bf}
  .pill{padding:5px 11px;border-radius:999px;font-size:11px;font-weight:900;background:#2a2417;color:#8a5600;white-space:nowrap}
  .red-pill{background:#241416;color:#b42323}
  .green-pill{background:#dcfce7;color:#15803d}
  .blue-pill{background:#2a2417;color:#8a6d1a}
  .detail-body{padding:17px}
  .order-info{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}
  .info-box{background:#1e1e27;border:1px solid var(--line);border-radius:10px;padding:12px}
  .info-box small{color:#8792a5;font-size:10.5px;font-weight:800;text-transform:uppercase}
  .info-box h4{font-size:16px;margin-top:6px}
  .status-text{color:var(--blue)}
  .items-table{width:100%;border-collapse:collapse;margin-top:6px}
  .items-table th,.items-table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:13.5px}
  .items-table th{background:#1e1e27;color:#8792a5;font-weight:800;font-size:11px;text-transform:uppercase}
  .food-line{display:flex;align-items:center;gap:11px;font-weight:700}
  .food-img{width:42px;height:42px;border-radius:9px;background:#23232e;object-fit:cover;display:grid;place-items:center;color:#55514a;overflow:hidden;flex:none}
  .food-img img{width:100%;height:100%;object-fit:cover}
  .qty-controls{display:flex;align-items:center;gap:7px}
  .qty-controls button{width:28px;height:28px;border:1px solid #2b2b35;background:#16161d;border-radius:50%;cursor:pointer;font-weight:900;font-size:14px}
  .status-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:18px}
  .flow-box{padding:12px;border-radius:10px;text-align:center;background:#1e1e27;color:#64748b;font-weight:800;font-size:12px;cursor:pointer}
  .flow-box.active{background:#2a2417;color:var(--blue)}
  .flow-box.done{background:#dcfce7;color:#15803d}
  .bill-body{padding:17px}
  .bill-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
  .bill-top h2{font-size:22px}
  .invoice{color:var(--blue);font-weight:900;font-size:12.5px}
  .bill-list{display:grid;gap:11px;margin:14px 0;max-height:230px;overflow:auto}
  .bill-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:11px}
  .bill-item b{font-size:14px}.bill-item small{color:#6b7280}
  .bill-qty{font-weight:900}
  .summary{border-top:1px solid var(--line);padding-top:12px}
  .sum-row{display:flex;justify-content:space-between;padding:7px 0;color:#4b5563;font-size:13.5px}
  .total{font-size:21px;font-weight:900;color:#e7c873}
  .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
  .action-grid .btn{padding:13px}
  /* generic table screens */
  .menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .dish{background:#16161d;border:1px solid var(--line);border-radius:13px;overflow:hidden}
  .dish .img{height:115px;background:#23232e;display:grid;place-items:center;color:#55514a;font-size:28px;cursor:pointer;position:relative;overflow:hidden}
  .dish .img img{width:100%;height:100%;object-fit:cover}
  .dish .img .up{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:4px 8px;border-radius:7px}
  .dish .b{padding:12px}.dish .dn{font-weight:700;font-size:13px}.dish .dc{font-size:11px;color:var(--muted);margin-top:2px}.dish .dp{margin-top:8px;font-weight:900;color:var(--blue)}
  .form{background:#16161d;border:1px solid var(--line);border-radius:13px;padding:22px;max-width:520px}
  .field{margin-bottom:15px}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}
  .field input{width:100%;padding:11px 13px;border:1px solid #2b2b35;border-radius:9px;font-size:13px;outline:0}
  .field input:focus{border-color:var(--blue)}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .tbig{padding:20px;text-align:center;border-radius:13px;font-weight:900;border:2px solid var(--line);background:#16161d;cursor:pointer}
  .tbig.occ{background:#241416;border-color:rgba(255,107,107,.4);color:var(--red)}
  .tbig.free{background:#142418;border-color:rgba(62,196,107,.4);color:var(--green)}
  .tbig small{display:block;font-weight:600;color:var(--muted);margin-top:5px;font-size:11px}
  .screen{display:none}.screen.show{display:block}
  /* modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:99;padding:18px}
  .modal-overlay.show{display:flex}
  .modal{background:#16161d;border-radius:16px;width:100%;max-width:940px;height:86vh;display:flex;overflow:hidden}
  .m-menu{flex:1;display:flex;flex-direction:column}
  .m-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
  .m-head h3{font-size:17px}
  .x{border:0;background:0;font-size:24px;color:var(--muted);cursor:pointer;line-height:1}
  .m-search{padding:13px 15px;border-bottom:1px solid var(--line)}
  .ssearch{display:flex;align-items:center;gap:8px;background:#1e1e27;border-radius:9px;padding:10px 12px}
  .ssearch input{border:0;background:0;outline:0;flex:1;font-size:13px}
  .m-cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .chip{border:0;border-radius:99px;padding:7px 14px;font-size:12px;font-weight:800;background:#23232e;color:var(--muted);cursor:pointer}
  .chip.active{background:var(--blue);color:#fff}
  .mgrid{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start}
  .mitem{border:1px solid var(--line);border-radius:12px;cursor:pointer;background:#16161d;overflow:hidden}
  .mitem:hover{border-color:var(--blue);box-shadow:0 4px 12px rgba(20,30,60,.08)}
  .mitem:active{transform:scale(.96)}
  .mitem .mimg{height:66px;background:#23232e;display:grid;place-items:center;color:#55514a;overflow:hidden}
  .mitem .mimg img{width:100%;height:100%;object-fit:cover}
  .mitem .mb{padding:9px}.mitem .mn{font-size:11.5px;font-weight:700;line-height:1.25}.mitem .mp{margin-top:5px;font-weight:900;color:var(--blue)}
  .m-cart{width:320px;border-left:1px solid var(--line);background:#1e1e27;display:flex;flex-direction:column}
  .m-types{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:14px}
  .m-type{border:0;border-radius:9px;padding:11px 4px;background:#16161d;color:var(--muted);font-weight:800;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;border:1px solid var(--line)}
  .m-type.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .m-table{margin:0 14px 9px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#16161d;outline:0;font-size:13px}
  .m-lines{flex:1;overflow:auto;padding:0 14px}
  .m-line{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
  .m-line .ml-n{flex:1;font-size:12px;font-weight:700}
  .step{width:27px;height:27px;border:1px solid var(--line);border-radius:8px;background:#16161d;cursor:pointer;font-weight:900;font-size:14px}
  .m-line .ml-q{width:22px;text-align:center;font-weight:900}
  .m-line .ml-p{width:62px;text-align:right;font-size:12px;font-weight:900}
  .m-tot{border-top:1px solid var(--line);padding:14px 16px;font-size:13.5px}
  .m-tot .l{display:flex;justify-content:space-between;color:var(--muted);padding:2px 0}
  .m-tot .t{display:flex;justify-content:space-between;font-weight:900;padding-top:5px;font-size:16px}
  .m-tot .t span:last-child{color:var(--blue)}
  .m-create{margin:14px;padding:14px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:900;font-size:14px;cursor:pointer}
  .m-create:disabled{opacity:.45}
  .empty{padding:40px 0;text-align:center;color:#a8b0bd;font-size:13px}

  .small-modal{background:#16161d;border-radius:16px;width:100%;max-width:520px;max-height:88vh;overflow:auto;box-shadow:0 18px 45px rgba(0,0,0,.18)}
  .form-grid{padding:18px;display:grid;gap:13px}
  .form-grid label{display:block;font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
  .form-grid input,.form-grid select,.form-grid textarea{width:100%;padding:12px 13px;border:1px solid #2b2b35;border-radius:10px;background:#16161d;font:inherit;font-size:13px;outline:0}
  .form-grid textarea{min-height:90px;resize:vertical}
  .form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus{border-color:var(--blue)}
  .readonly-field{background:#1e1e27!important;color:#64748b!important;cursor:not-allowed}
  .admin-lock{display:flex;align-items:center;gap:8px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:10px 12px;border-radius:10px;font-size:12px;font-weight:800;margin-top:12px}

  .inline-editor{background:#1e1e27;border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;max-width:620px}
  .inline-editor label{font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase}
  .inline-editor textarea{width:100%;min-height:82px;border:1px solid #2b2b35;border-radius:9px;padding:12px;font:inherit;font-size:13px;resize:vertical;outline:0;background:#16161d}
  .inline-editor textarea:focus{border-color:var(--blue)}
  .inline-actions{display:flex;gap:8px;justify-content:flex-end}
  .role-edit-row td{background:#1e1e27!important}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#161b26;color:#fff;padding:12px 22px;border-radius:99px;font-weight:700;font-size:13px;display:none;align-items:center;gap:9px;z-index:120;box-shadow:0 12px 30px rgba(0,0,0,.3)}
  .toast.show{display:flex}
  .toast .d{width:8px;height:8px;border-radius:99px;background:#4ade80}
  /* ===== PREMIUM POLISH & ANIMATIONS ===== */
  @keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes popIn{0%{opacity:0;transform:scale(.92) translateY(20px)}100%{opacity:1;transform:scale(1) translateY(0)}}
  @keyframes toastUp{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
  @keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(46,200,77,.5)}70%{box-shadow:0 0 0 6px rgba(46,200,77,0)}}
  /* content fades up each time a tab renders */
  #main>*{animation:riseIn .34s cubic-bezier(.22,1,.36,1) both}
  #main>*:nth-child(2){animation-delay:.05s}
  #main>*:nth-child(3){animation-delay:.10s}
  #main>*:nth-child(4){animation-delay:.14s}
  /* stat cards subtle lift */
  .stat{transition:transform .18s ease,box-shadow .18s ease}
  .stat:hover{transform:translateY(-3px);box-shadow:0 14px 30px -14px rgba(20,30,60,.25)}
  /* order cards */
  .order-card{transition:transform .14s ease,box-shadow .14s ease,background .14s ease}
  .order-card:hover{transform:translateY(-2px)}
  .order-card .dot{animation:pulseDot 2s infinite}
  /* nav links */
  .nav-link{transition:background .15s ease,color .15s ease,padding-left .15s ease}
  .nav-link:hover{padding-left:16px}
  /* buttons: smooth press + hover glow */
  .btn,.m-create,.chip,.flow-box,.role-switch button,.logout{transition:transform .12s ease,box-shadow .18s ease,background .18s ease,color .15s ease}
  .btn.blue:hover{box-shadow:0 10px 22px -10px rgba(212,175,55,.7)}
  .btn.green:hover{box-shadow:0 10px 22px -10px rgba(31,143,58,.6)}
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(1px) scale(.98)}
  /* modal animations */
  .modal-overlay{animation:fadeIn .2s ease}
  .modal-overlay.show .modal{animation:popIn .32s cubic-bezier(.22,1,.36,1)}
  /* menu dish cards */
  .dish{transition:transform .16s ease,box-shadow .16s ease}
  .dish:hover{transform:translateY(-4px);box-shadow:0 18px 38px -18px rgba(20,30,60,.3)}
  .dish .img img,.food-img img{transition:transform .25s ease}
  .dish:hover .img img{transform:scale(1.06)}
  /* menu item tiles in order modal */
  .mitem{transition:transform .12s ease,box-shadow .16s ease,border-color .16s ease}
  .mitem:hover{transform:translateY(-2px)}
  /* table cards */
  .tbig{transition:transform .14s ease,box-shadow .16s ease}
  .tbig:hover{transform:translateY(-3px);box-shadow:0 12px 26px -14px rgba(20,30,60,.25)}
  /* flow steps + chips */
  .flow-box:hover{transform:translateY(-2px)}
  .chip:hover{transform:translateY(-1px)}
  /* table rows hover */
  .items-table tbody tr{transition:background .12s ease}
  /* toast */
  .toast.show{animation:toastUp .3s cubic-bezier(.22,1,.36,1)}
  /* role switch active pop */
  .role-switch button.active{animation:popIn .25s ease}
  /* respect reduced motion */
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  @media(max-width:980px){.sidebar{position:relative;top:0;width:100%;height:auto}.app{display:block}.main{margin-left:0;width:100%}.pos-grid,.stats,.order-info{grid-template-columns:1fr}.bill-panel{grid-column:auto}}


  /* ===== DARK LUXURY GOLD THEME ===== */
  body{background:#0c0c11;color:#f1ece1}
  .topbar{background:linear-gradient(90deg,#141019,#1c1810);border-bottom:1px solid #2b2b35}
  .topbar .tb-left{color:#e7c873}
  .tb-badge{background:rgba(212,175,55,.16);color:#d4af37}
  .role-switch{background:rgba(255,255,255,.06)}
  .role-switch button{color:#cdbf9a}
  .role-switch button.active{background:linear-gradient(135deg,#b8912f,#e7c873);color:#15130c}
  .sidebar{background:#16161d;border-right:1px solid #2b2b35}
  .brand{border-bottom:1px solid #2b2b35}
  .brand-icon{background:linear-gradient(135deg,#b8912f,#e7c873);color:#15130c}
  .brand h3{color:#f1ece1}
  .group-title{color:#6f6a60}
  .nav-link{color:#bbb4a6}
  .nav-link:hover{background:#1e1e27}
  .nav-link.active{background:rgba(212,175,55,.12);color:#d4af37}
  .nav-link .ic{background:#55514a}
  .nav-link.active .ic{background:#d4af37}

<script>
/* ---------- EDITABLE ---------- */
let restaurantName="Smart POS";
let logoImg=null;
let role="cashier";

let MENU=[
  {id:1,name:"Chicken Seekh Kabab 2pc",price:15,cat:"Kababs",img:"assets/menu/chicken-seekh-kabab.png"},
  {id:2,name:"Beef Seekh Kabab 2pc",price:17,cat:"Kababs",img:"assets/menu/beef-seekh-kabab.png"},
  {id:3,name:"Chicken Tikka",price:16,cat:"Kababs",img:"assets/menu/chicken-tikka.png"},
  {id:4,name:"Mutton Chops",price:25,cat:"Kababs",img:"assets/menu/mutton-chops.png"},
  {id:5,name:"Chicken Biryani",price:15,cat:"Rice",img:"assets/menu/chicken-biryani.png"},
  {id:6,name:"Mutton Biryani",price:20,cat:"Rice",img:"assets/menu/mutton-biryani.png"},
  {id:7,name:"Chicken Achari New",price:15,cat:"Curries",img:"assets/menu/chicken-achari.png"},
  {id:8,name:"Plain Naan",price:3,cat:"Breads",img:"assets/menu/plain-naan.png"},
  {id:9,name:"Garlic Naan",price:5,cat:"Breads",img:"assets/menu/garlic-naan.png"},
  {id:10,name:"Roghni Naan",price:4,cat:"Breads",img:"assets/menu/roghni-naan.png"},
  {id:11,name:"Chicken Karahi",price:35,cat:"Curries",img:"assets/menu/chicken-karahi.png"},
  {id:12,name:"Daal Makhani",price:14,cat:"Curries",img:"assets/menu/daal-makhani.png"},
  {id:13,name:"Mango Lassi",price:7,cat:"Drinks",img:"assets/menu/mango-lassi.png"},
  {id:14,name:"Soft Drink",price:5,cat:"Drinks",img:"assets/menu/soft-drink.png"},
  {id:15,name:"Fresh Juice",price:9,cat:"Drinks",img:"assets/menu/fresh-juice.png"},
];
const TYPES=[{k:"dine",l:"Dine-In",s:"DI"},{k:"take",l:"Takeaway",s:"TA"},{k:"delivery",l:"Delivery",s:"DL"}];
const FLOW=["Received","Preparing","Ready","Completed"];
const SERVICE=0.05, TAX=0.06;
const rm=n=>"RM "+Number(n).toFixed(2);
const localDateKey=(d=new Date())=>{
  const dt=(d instanceof Date)?d:new Date(d);
  if(isNaN(dt)) return new Date().toISOString().slice(0,10);
  const y=dt.getFullYear();
  const m=String(dt.getMonth()+1).padStart(2,"0");
  const day=String(dt.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
};
const normalizeSaleKey=(k)=>{
  if(!k) return localDateKey(new Date());
  if(/^\d{4}-\d{2}-\d{2}$/.test(String(k))) return String(k);
  const d=new Date(k);
  if(!isNaN(d)) return localDateKey(d);
  const parts=String(k).split(/[\/-]/).map(Number);
  if(parts.length>=2){
    const year=parts[2]||new Date().getFullYear();
    const day=String(parts[0]).padStart(2,"0");
    const mon=String(parts[1]).padStart(2,"0");
    return `${year}-${mon}-${day}`;
  }
  return String(k);
};
const shortDate=(key)=>{const p=String(key).split('-');return p.length===3?`${Number(p[2])}/${Number(p[1])}`:String(key)};
const dayName=(key)=>{const d=new Date(key+'T00:00:00');return isNaN(d)?'—':d.toLocaleDateString('en-US',{weekday:'short'});};
const uid=()=>"#"+Math.random().toString(36).slice(2,8).toUpperCase();
const cats=()=>["All",...new Set(MENU.map(m=>m.cat))];
let menuCat="All";
let imgTarget=null;
let dishEditId=null, dishTempImg=null;

const NAV=[
  {g:"Orders & Dining",items:[{k:"pos",l:"Orders Dashboard",badge:3},{k:"waiter",l:"Waiter Order Screen"},{k:"quickpos",l:"Quick POS Billing"},{k:"tables",l:"Tables"}]},
  {g:"Reports & Analytics",items:[{k:"reports",l:"Reports"},{k:"closing",l:"Daily Closing"},{k:"analytics",l:"Restaurant Analytics"}]},
  {g:"Menu & Marketing",items:[{k:"menu",l:"Menu & Dishes"},{k:"recipes",l:"Recipe Auto Stock"},{k:"qr",l:"QR Table Ordering"},{k:"promotions",l:"Promotions"}]},
  {g:"Management",items:[{k:"staff",l:"Staff Center"},{k:"roles",l:"Roles & Permissions"},{k:"cashier",l:"Cashier Features"},{k:"customers",l:"Daily Summary"},{k:"inventory",l:"Inventory"},{k:"expenses",l:"Expenses"},{k:"kotprinter",l:"Auto KOT Printer"},{k:"branches",l:"Multi Branch"},{k:"loyalty",l:"Loyalty Points"},{k:"settings",l:"Settings"}]},
];
const ROLE_NAV={
  waiter:["waiter","tables"],
  kitchen:["pos"],
  tandoor:["pos"],
  cashier:null
};

/* ---------- DATA ---------- */
let orders=[];
let salesLog=[]; /* real sales records, grows when orders are settled */
let seq=1001, selNo=null, tab="running";
let tables=Array.from({length:12},(_,i)=>({n:i+1,occ:false}));
let bookings=[];
let serviceReqs=[];
let staff=[];
let inventory=[];
let expenses=[];
let promos=[];
let customers=[];
let branches=[];
const PERMISSION_OPTIONS=["Full access","Orders Dashboard","Create Orders","Edit Orders","Settle Bills","Split Payment","Discount","Refund / Void","Print Receipts","Past Orders","Tables","Quick POS Billing","Reports","Restaurant Analytics","Daily Closing","Expenses","Menu & Dishes","Recipe Auto Stock","QR Table Ordering","Promotions","Staff Center","Roles & Permissions","Cashier Features","Daily Summary","Inventory","Auto KOT Printer","Multi Branch","Loyalty Points","Settings"];
let rolePerms=[
  {role:"Admin",perms:[...PERMISSION_OPTIONS]},
  {role:"Manager",perms:PERMISSION_OPTIONS.filter(p=>!["Settings"].includes(p))},
  {role:"Cashier",perms:["Orders Dashboard","Settle Bills","Split Payment","Discount","Refund / Void","Print Receipts","Past Orders","Reports","Daily Closing","Expenses","Menu & Dishes","Cashier Features","Daily Summary"]},
  {role:"Waiter",perms:["Create Orders","Tables"]}
];
let openRoleIndex=null;
let barcodeText="";

/* ---------- HELPERS ---------- */
const typeMeta=k=>TYPES.find(t=>t.k===k);
const findImg=id=>{const m=MENU.find(x=>x.id===id);return m?m.img:null;};
const stationOf=i=>{const c=(i.cat||MENU.find(m=>m.id===i.id)?.cat||"").toLowerCase(); if(c.includes("bread")||c.includes("naan"))return "Tandoor"; if(c.includes("bbq")||c.includes("kabab")||c.includes("tikka")||c.includes("chops"))return "BBQ"; if(c.includes("drink")||c.includes("lassi")||c.includes("juice"))return "Drinks"; return "Main Kitchen";};
const stationIcon=s=>s==="Tandoor"?"🔥":s==="BBQ"?"🍢":s==="Drinks"?"🥤":"🍲";
const subOf=o=>o.items.reduce((s,i)=>s+i.price*i.qty,0);
function totals(o){const sub=subOf(o);const svc=sub*SERVICE;const tax=sub*TAX;return{sub,svc,tax,total:sub+svc+tax};}

/* ---------- ROLE ---------- */
function setRole(r){
  role=r;
  document.getElementById("roleCashier").classList.toggle("active",r==="cashier");
  document.getElementById("roleWaiter").classList.toggle("active",r==="waiter");
  const kbtn=document.getElementById("roleKitchen"); if(kbtn)kbtn.classList.toggle("active",r==="kitchen");
  const tbtn=document.getElementById("roleTandoor"); if(tbtn)tbtn.classList.toggle("active",r==="tandoor");
  if(r==="waiter") nav="waiter";
  if(r==="kitchen"||r==="tandoor") nav="pos";
  if(r==="cashier" && nav==="waiter") nav="pos";
  renderNav();
  toast(r==="waiter"?"Waiter mode — simple order taking":r==="kitchen"?"Kitchen mode — main kitchen only":r==="tandoor"?"Tandoor mode — breads only":"Cashier mode — billing");
  render();
}

/* ---------- SIDEBAR ---------- */
let nav="pos";
function renderNav(){
  const allowed=ROLE_NAV[role];
  document.getElementById("nav").innerHTML=NAV.map(g=>{
    const items=allowed?g.items.filter(it=>allowed.includes(it.k)):g.items;
    if(!items.length)return "";
    return `<div class="group-title">${g.g}</div>${items.map(it=>`<div class="nav-link ${nav===it.k?'active':''}" onclick="go('${it.k}')"><span class="ic"></span><span>${it.l}</span>${it.badge?`<span class="badge">${it.badge}</span>`:''}</div>`).join("")}`;
  }).join("");
  document.getElementById("brandName").textContent=restaurantName;
  document.getElementById("tbTitle").textContent=restaurantName;
  const bl=document.getElementById("brandLogo");bl.innerHTML=logoImg?`<img src="${logoImg}">`:restaurantName.charAt(0).toUpperCase();
}
function go(k){nav=k;renderNav();render();}

/* ---------- ROUTER ---------- */
function render(){
  const m=document.getElementById("main");
  const v={pos:posView,waiter:waiterView,quickpos:quickPosView,kds:kdsView,tables:tablesView,reports:reportView,closing:closingView,analytics:analyticsView,menu:menuView,modifiers:modifiersView,recipes:recipesView,qr:qrView,promotions:promoView,staff:staffView,roles:rolesView,cashier:cashierFeaturesView,inventory:invView,expenses:expensesView,kotprinter:kotPrinterView,branches:branchesView,customers:customerFeaturesView,loyalty:loyaltyView,settings:settingsView}[nav];
  m.innerHTML=v?v():"";
  queueSave();
}

/* ---------- POS ---------- */
function todayKey(){return localDateKey(new Date());}
function todayOrderStats(){
  const key=todayKey();
  const paidToday=salesLog.filter(r=>normalizeSaleKey(r.key)===key);
  const openOrders=orders;
  const totalOrders=openOrders.length + paidToday.length;
  const dineOrders=openOrders.filter(o=>o.type==="dine").length + paidToday.filter(r=>r.type==="dine").length;
  const takeOrders=openOrders.filter(o=>o.type==="take").length + paidToday.filter(r=>r.type==="take").length;
  const deliveryOrders=openOrders.filter(o=>o.type==="delivery").length + paidToday.filter(r=>r.type==="delivery").length;
  const todaySales=paidToday.reduce((s,r)=>s+Number(r.sales||0),0);
  return {totalOrders,dineOrders,takeOrders,deliveryOrders,todaySales};
}
function posView(){
  const running=orders;
  const stats=todayOrderStats();
  const past=pastSalesToday();
  const sel=tab==='past'?past.find(o=>o.no===selNo):orders.find(o=>o.no===selNo);
  return `
  <div class="top-head">
    <div><h1>Order Dashboard</h1><p>${role==='waiter'?'Take orders and send to kitchen':'Manage running orders, bills and payments'} — one screen.</p></div>
    <div class="head-actions">
      <button class="btn light">🖨 Printer</button>
      <button class="btn blue" onclick="openModal()">+ Create New Order</button>
    </div>
  </div>
  <div class="stats" id="posStats">${posStatsHtml(running,stats)}</div>
  <div class="pos-grid">
    <section class="panel">
      <div class="panel-head"><h3>Orders</h3><span class="pill">${running.length} Running</span></div>
      <div class="tabs"><div class="tab ${tab==='running'?'active':''}" onclick="setTab('running')">RUNNING</div><div class="tab ${tab==='past'?'active':''}" onclick="setTab('past')">PAST</div></div>
      <div class="filters"><select class="input"><option>Invoice No.</option><option>Table No.</option></select><input class="input" placeholder="Search by invoice no."></div>
      <div class="order-list" id="orderList">${listOrders()}</div>
    </section>
    <section class="panel" id="orderDetailsPanel">${orderDetailsPanelHtml(sel)}</section>
    <section class="panel bill-panel" id="billPanel">${billPanelHtml(sel)}</section>
  </div>`;
}
function posStatsHtml(running,stats){return `
    <div class="stat"><small>Total Orders</small><h2>${stats.totalOrders}</h2><div class="trend up">${running.length} running</div></div>
    <div class="stat"><small>Total Dine-In Orders</small><h2>${stats.dineOrders}</h2></div>
    <div class="stat"><small>Total Takeaway Orders</small><h2>${stats.takeOrders}</h2></div>
    <div class="stat ${role==='waiter'?'hide-cashier':''}"><small>Total Sales</small><h2>${rm(stats.todaySales)}</h2><div class="trend up">Paid orders only</div></div>`;}
function orderDetailsPanelHtml(sel){return `<div class="panel-head"><h3>Order Details</h3><span class="invoice">${sel?sel.inv:''}</span></div>${sel?(tab==='past'?pastDetailBody(sel):detailBody(sel)):'<div class="empty">Select an order</div>'}`;}
function billPanelHtml(sel){return `<div class="panel-head"><h3>${role==='waiter'?'Order Actions':'Bill Summary'}</h3>${sel?`<span class="pill ${sel.status==='Paid'?'green-pill':'red-pill'}">${sel.status}</span>`:''}</div>${sel?(tab==='past'?pastBillBody(sel):billBody(sel)):'<div class="empty">No order selected</div>'}`;}
function updatePOSPartial(updateList=false){
  if(nav!=='pos' && nav!=='waiter')return render();
  const running=orders, stats=todayOrderStats(), past=pastSalesToday();
  const sel=tab==='past'?past.find(o=>o.no===selNo):orders.find(o=>o.no===selNo);
  const ps=document.getElementById('posStats'); if(ps)ps.innerHTML=posStatsHtml(running,stats);
  if(updateList){const ol=document.getElementById('orderList'); if(ol)ol.innerHTML=listOrders();}
  const od=document.getElementById('orderDetailsPanel'); if(od)od.innerHTML=orderDetailsPanelHtml(sel);
  const bp=document.getElementById('billPanel'); if(bp)bp.innerHTML=billPanelHtml(sel);
  queueSave();
}
function pastSalesToday(){
  const key=todayKey();
  return salesLog.filter(r=>normalizeSaleKey(r.key)===key).slice().reverse();
}
function listOrders(){
  if(tab==="past"){
    const past=pastSalesToday();
    if(!past.length)return '<div class="empty">No past orders today</div>';
    return past.map(r=>{const a=r.no===selNo;const typ=typeMeta(r.type||'take')?.l||'Order';

function setStage(no,s){const o=orders.find(x=>x.no===no);if(o)o.stage=s;updatePOSPartial(true);}

function savePaidSale(o,method){
  if(!o)return;
  o.pay=method||'Cash';
  o.status='Paid';
  if(!o.saleSaved){
    const dt=new Date();
    salesLog.push({
      key:localDateKey(dt),
      sales:totals(o).total,
      method:o.pay,
      type:o.type,
      no:o.no,
      table:o.table || '',
      itemsCount:o.items.reduce((s,i)=>s+i.qty,0),
      itemsList:o.items.map(i=>({id:i.id,name:i.name,price:i.price,qty:i.qty,cat:i.cat||MENU.find(m=>m.id===i.id)?.cat})),
      time:new Date().toLocaleTimeString()
    });
    o.saleSaved=true;
  }
}
function showPaymentPopup(no,afterComplete=false){
  const o=orders.find(x=>x.no===no); if(!o)return;
  const methods=activePaymentMethods();
  if(!methods.length){toast('No active payment method. Enable one from Cashier Features.');return;}
  const t=totals(o);
  const old=document.getElementById('paymentModal'); if(old)old.remove();
  const html=`<div class="modal-overlay show" id="paymentModal"><div class="small-modal" style="max-width:580px">
    <div class="m-head"><h3>Choose Payment Method</h3><button class="x" onclick="document.getElementById('paymentModal').remove()">×</button></div>
    <div style="padding:18px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">

      </div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">
        ${methods.map(m=>`<button class="btn blue" style="padding:16px" onclick="confirmPayment('${o.no}','${m.replace(/'/g,"\\'")}',${afterComplete})">${m}</button>`).join('')}
      </div>
      <p style="color:var(--muted);font-size:12px;margin-top:14px">Payment options come from Cashier Features. Disable/enable options there.</p>
    </div>
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
}
function confirmPayment(no,method,afterComplete=false){
  const o=orders.find(x=>x.no===no); if(!o)return;
  savePaidSale(o,method);
  const pm=document.getElementById('paymentModal'); if(pm)pm.remove();
  showAfterPaymentPopup(no,method,afterComplete);
}
function showAfterPaymentPopup(no,method,afterComplete=false){
  const o=orders.find(x=>x.no===no);
  const old=document.getElementById('afterPaymentModal'); if(old)old.remove();
  const html=`<div class="modal-overlay show" id="afterPaymentModal"><div class="small-modal" style="max-width:520px">
    <div class="m-head"><h3>Payment Done</h3><button class="x" onclick="finishPayment('${no}',${afterComplete},false)">×</button></div>
    <div style="padding:18px;text-align:center">
      <div style="font-size:38px;margin-bottom:8px">✅</div>
      <h2 style="margin-bottom:6px">${no} paid by ${method}</h2>
      <p style="color:var(--muted);margin-bottom:18px">Do you want to print the bill?</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <button class="btn light" onclick="finishPayment('${no}',${afterComplete},false)">Done</button>
        <button class="btn green" onclick="finishPayment('${no}',${afterComplete},true)">Print Bill</button>
      </div>
    </div>
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
}
function finishPayment(no,afterComplete=false,doPrint=false){
  const o=orders.find(x=>x.no===no);
  if(doPrint && o) printReceipt(no);
  const ap=document.getElementById('afterPaymentModal'); if(ap)ap.remove();
  if(afterComplete){
    orders=orders.filter(x=>x.no!==no);
    selNo=orders[0]?orders[0].no:null;
    toast(no+' completed');
  }else{
    toast(no+' settled');
  }
  render();
}
function settle(no){showPaymentPopup(no,false);}
function complete(no){showPaymentPopup(no,true);}

function staffView(){
  const present=staff.filter(s=>s.s==='Present'||s.s==='On Duty').length;
  const onDuty=staff.filter(s=>s.s==='On Duty'||(s.ci&&s.ci!=='-'&&!s.co)).length;

    const action=s.s==='On Duty'||(s.ci&&s.ci!=='-'&&!s.co)

  });

  `<div class="stats"><div class="stat"><small>Total Staff</small><h2>${staff.length}</h2></div><div class="stat"><small>Present</small><h2>${present}</h2></div><div class="stat"><small>On Duty</small><h2>${onDuty}</h2></div><div class="stat"><small>Total Hours</small><h2>${totalHours.toFixed(2)}</h2></div></div>`+
  panelTable(["Staff","Role","Branch","Check In","Check Out","Hours","Status","Action"],rows);

function staffCheckIn(i){const s=staff[i];s.ci=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});s.checkInTs=Date.now();s.co='';s.s='On Duty';toast(s.u+' checked in');render();}
function staffCheckOut(i){const s=staff[i];s.co=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});const ms=s.checkInTs?Date.now()-Number(s.checkInTs):0;s.hours=Number(s.hours||0)+(ms?ms/3600000:0);s.checkInTs=null;s.s='Checked Out';toast(s.u+' checked out');render();}
function editStaff(i){const s=staff[i];openFormModal('Edit Staff Member',[{name:'u',label:'Staff Name',value:s.u,required:true},{name:'d',label:'Designation',type:'select',value:s.d||'Waiter',options:['Cashier','Waiter','Kitchen','Tandoor','Manager','Admin']},{name:'l',label:'Location / Outlet',value:s.l||'Main Branch'},{name:'s',label:'Status',type:'select',value:s.s||'Absent',options:['Absent','Present','On Duty','Checked Out']}],d=>{s.u=d.u.trim();s.d=d.d;s.l=d.l;s.s=d.s;toast('Staff updated');});}
function invStatus(q,alert=8){q=Number(q)||0;alert=Number(alert)||0;return q<=0?'out':q<=alert?'low':'good'}
function invView(){
  inventory.forEach(i=>{i.alert=invAlert(i);i.s=invStatus(i.q,i.alert)});
  const out=inventory.filter(i=>i.s==="out").length,low=inventory.filter(i=>i.s==="low").length,good=inventory.filter(i=>i.s==="good").length;
  const alerts=inventory.filter(i=>i.s!=="good");
  return head("Inventory","Ingredient stock and low-stock alerts",'<button class="btn blue" onclick="addIngredient()">+ Add Ingredient</button>')+
  `<div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><small>Out of Stock</small><h2 style="color:var(--red)">${out}</h2></div><div class="stat"><small>Low Stock</small><h2 style="color:var(--orange)">${low}</h2></div><div class="stat"><small>In Stock</small><h2 style="color:var(--green)">${good}</h2></div></div>`+
  (alerts.length?`<div class="panel" style="padding:14px;margin-bottom:14px;border-left:5px solid var(--orange)"><b>⚠ Low Stock Warning</b><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${alerts.map(i=>`<span class="pill ${i.s==='out'?'red-pill':'blue-pill'}">${i.i}: ${i.q}${i.u} / alert ${invAlert(i)}${i.u}</span>`).join('')}</div></div>`:'')+
  panelTable(["Ingredient","Stock","Unit","Low Warning","Status","Adjust","Action"],inventory.map((i,idx)=>[`<b>${i.i}</b>`,i.q,i.u,`≤ ${invAlert(i)} ${i.u}`,pill(i.s==='good'?'In Stock':i.s==='low'?'Low Stock':'Out of Stock',i.s==='good'?'green':'red'),`<button class="step" onclick="adjStock(${idx},-1)">−</button> <button class="step" onclick="adjStock(${idx},1)">+</button>`,`<button class="chip" onclick="editIngredient(${idx})">Edit</button>`]));
}
function adjStock(idx,d){const it=inventory[idx];it.q=Math.max(0,Number(it.q||0)+d);it.alert=invAlert(it);it.s=invStatus(it.q,it.alert);render();}
function addIngredient(){openFormModal('Add Ingredient',[{name:'name',label:'Ingredient name'},{name:'q',label:'Quantity',type:'number',value:10},{name:'u',label:'Unit',type:'select',value:'kg',options:['kg','liter','piece']},{name:'alert',label:'Low stock warning at',type:'number',value:5,placeholder:'Example: 5'}],d=>{if(!d.name)return;const q=parseFloat(d.q)||0;const u=d.u||'kg';const alert=parseFloat(d.alert)||0;inventory.push({i:d.name,q,u,alert,s:invStatus(q,alert)});toast(d.name+' added');});}
function editIngredient(idx){const it=inventory[idx];openFormModal('Edit Ingredient',[{name:'name',label:'Ingredient name',value:it.i,required:true},{name:'q',label:'Quantity',type:'number',value:it.q},{name:'u',label:'Unit',type:'select',value:it.u||'kg',options:['kg','liter','piece']},{name:'alert',label:'Low stock warning at',type:'number',value:invAlert(it)}],d=>{const newQty=Number(d.q);it.i=(d.name||it.i).trim();it.q=Number.isFinite(newQty)?newQty:0;it.u=d.u||'kg';it.alert=Number(d.alert)||0;it.s=invStatus(it.q,it.alert);toast('Ingredient updated');});}

/* ---------- EXPENSES ---------- */
const EXPENSE_CATS=['Staff Meal','Gas','Supplies','Repair','Utilities','Rent','Delivery','Other'];
const EXPENSE_METHODS=['Cash','TNG','Debit Card','QR','Card'];
function todayISO(){return new Date().toISOString().slice(0,10)}
function todayExpenseRows(){return expenses.filter(e=>(e.date||todayISO())===todayISO());}
function expenseSum(rows=expenses){return rows.reduce((s,e)=>s+Number(e.amount||0),0)}
function expenseByMethod(methods,rows=todayExpenseRows()){return rows.filter(e=>methods.includes(e.method||'Cash')).reduce((s,e)=>s+Number(e.amount||0),0)}
function expensesView(){
  const today=todayExpenseRows(), month=expenses.filter(e=>(e.date||'').slice(0,7)===todayISO().slice(0,7));
  return head('Expenses','Add restaurant expenses with payment type and receipt upload','<button class="btn blue" onclick="addExpense()">+ Add Expense</button><button class="btn dark" onclick="downloadCSV(\'expenses\',[\'Date\',\'Category\',\'Description\',\'Payment Type\',\'Amount\',\'Receipt\'],expenses.map(e=>[e.date,e.category,e.desc,e.method,e.amount,e.receipt?\'Yes\':\'No\']))">Download Expenses</button>')+
  `<div class="stats"><div class="stat"><small>Today Expenses</small><h2>${rm(expenseSum(today))}</h2></div><div class="stat"><small>Cash Expenses Today</small><h2>${rm(expenseByMethod(['Cash'],today))}</h2></div><div class="stat"><small>QR/TNG/Card Today</small><h2>${rm(expenseSum(today)-expenseByMethod(['Cash'],today))}</h2></div><div class="stat"><small>This Month</small><h2>${rm(expenseSum(month))}</h2></div></div>`+
  panelTable(['Date','Category','Description','Payment','Amount','Receipt','Action'],expenses.slice().reverse().map(e=>[e.date||'-',`<b>${e.category||'Other'}</b>`,e.desc||'-',e.method||'Cash',`<b>${rm(e.amount||0)}</b>`,e.receipt?`<button class="chip" onclick="viewExpenseReceipt('${e.id}')">View</button>`:`<button class="chip" onclick="uploadExpenseReceipt('${e.id}')">Upload</button>`,`<button class="chip" onclick="editExpense('${e.id}')">Edit</button> <button class="chip" style="color:var(--red)" onclick="deleteExpense('${e.id}')">Delete</button>`]));
}
function addExpense(){
  openFormModal('Add Expense',[
    {name:'date',label:'Date',type:'date',value:todayISO(),required:true},
    {name:'category',label:'Category',type:'select',value:'Staff Meal',options:EXPENSE_CATS,required:true},
    {name:'desc',label:'Description',placeholder:'e.g. Staff lunch / gas cylinder'},
    {name:'method',label:'Payment Type',type:'select',value:'Cash',options:EXPENSE_METHODS,required:true},
    {name:'amount',label:'Amount (RM)',type:'number',value:0,required:true},
    {name:'receipt',label:'Receipt Upload',type:'file',accept:'image/*,application/pdf',required:true,note:'Receipt is mandatory. Expense will not save without it.'}
  ],d=>{
    const amount=parseFloat(d.amount)||0;

let qrTable="01";
let savedQRCodes=[];
function menuBaseUrl(){return location.href.split('?')[0].replace('app.html','menu.html');}
function qrTableClean(t=qrTable){return String(t).replace(/^T/i,'').padStart(2,'0');}
function qrMenuLink(t=qrTable){return menuBaseUrl()+"?table=T"+qrTableClean(t);}
function qrImageUrl(link,size=260){return 'https://api.qrserver.com/v1/create-qr-code/?size='+size+'x'+size+'&data='+encodeURIComponent(link);}
function copyQRLink(t=qrTable){navigator.clipboard?.writeText(qrMenuLink(t)).then(()=>toast('QR menu link copied')).catch(()=>toast('Copy not available'));}
function saveCurrentQR(){
  const t=qrTableClean(qrTable);
  const link=qrMenuLink(t);
  const exists=savedQRCodes.find(x=>x.table===t);
  if(exists){exists.link=link;exists.updated_at=new Date().toISOString();toast('Table T'+t+' QR updated');}
  else{savedQRCodes.push({table:t,link,created_at:new Date().toISOString(),updated_at:new Date().toISOString()});toast('Table T'+t+' QR saved');}
  render();
}
function deleteSavedQR(t){
  if(confirm('Delete saved QR for Table T'+qrTableClean(t)+'?')){savedQRCodes=savedQRCodes.filter(x=>x.table!==qrTableClean(t));toast('Saved QR deleted');render();}
}
function printQRFor(t=qrTable){
  const table=qrTableClean(t);

function head(title,sub,actions){return `<div class="top-head"><div><h1>${title}</h1><p>${sub}</p></div><div class="head-actions">${actions||''}</div></div>`;}
function pill(txt,color){return `<span class="pill ${color==='red'?'red-pill':color==='green'?'green-pill':color==='blue'?'blue-pill':''}">${txt}</span>`;}

let formModalSave=null;
function escAttr(v){return String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function openFormModal(title,fields,onSave){
  formModalSave=onSave;
  const body=document.getElementById('formModalBody');
  document.getElementById('formModalTitle').textContent=title;
  body.innerHTML=fields.map(f=>{
    const val=escAttr(f.value??'');
    const req=f.required?' <span style="color:var(--red)">*</span>':'';
    const note=f.note?`<small style="display:block;color:var(--muted);margin-top:5px">${escAttr(f.note)}</small>`:'';
    if(f.type==='select'){
      return `<div><label>${f.label}${req}</label><select id="fm_${f.name}">${(f.options||[]).map(o=>`<option value="${escAttr(o)}" ${String(o)==String(f.value)?'selected':''}>${escAttr(o)}</option>`).join('')}</select>${note}</div>`;
    }
    if(f.type==='textarea') return `<div><label>${f.label}${req}</label><textarea id="fm_${f.name}" placeholder="${escAttr(f.placeholder||'')}">${escAttr(f.value||'')}</textarea>${note}</div>`;
    if(f.type==='file') return `<div><label>${f.label}${req}</label><input id="fm_${f.name}" type="file" accept="${escAttr(f.accept||'image/*,application/pdf')}" ${f.required?'data-required="1"':''}>${note}</div>`;
    return `<div><label>${f.label}${req}</label><input id="fm_${f.name}" type="${f.type||'text'}" value="${val}" placeholder="${escAttr(f.placeholder||'')}" ${f.required?'data-required="1"':''}>${note}</div>`;
  }).join('');
  document.getElementById('formModal').classList.add('show');
  setTimeout(()=>{const first=body.querySelector('input:not([type=file]),select,textarea'); if(first)first.focus();},60);
}
function closeFormModal(){document.getElementById('formModal').classList.remove('show');formModalSave=null;}
function readFileAsDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});}
async function saveFormModal(){
  if(!formModalSave)return closeFormModal();
  const data={};
  for(const el of document.querySelectorAll('#formModalBody [id^="fm_"]')){
    const name=el.id.replace('fm_','');
    if(el.type==='file'){
      const f=el.files&&el.files[0];
      if(el.dataset.required==='1' && !f){toast('Receipt upload is required');return;}
      if(f){data[name]=await readFileAsDataURL(f);data[name+'Name']=f.name;}
      else{data[name]='';data[name+'Name']='';}
    }else{
      if(el.dataset.required==='1' && !String(el.value||'').trim()){toast('Please fill required fields');return;}
      data[name]=el.value;
    }
  }
  const ok=await formModalSave(data);
  if(ok===false)return;
  closeFormModal();
  render();
}

function simpleLineGraph(rows,metric='sales'){
  const vals=rows.length?rows.map(r=>Number(r[metric]||0)):[0];
  const max=Math.max(...vals,1);
  const w=1000,h=210,pad=42;
  const pts=vals.map((v,i)=>{const x=pad+(rows.length<=1?0:i*(w-pad*2)/(rows.length-1)); const y=h-pad-(v/max)*(h-pad*2); return `${x},${y}`;});
  const area=`${pad},${h-pad} `+pts.join(' ')+` ${pts[pts.length-1].split(',')[0]},${h-pad}`;
  const labels=[1,.75,.5,.25,0].map(fr=>{const y=h-pad-fr*(h-pad*2); const val=max*fr; return `<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="rgba(0,0,0,.10)"/><text x="8" y="${y+4}" font-size="12" fill="#8f846f">${metric==='sales'?rm(val):Math.round(val)}</text>`;}).join('');
  return `<section class="panel" style="padding:18px"><h3 style="margin-bottom:10px">${metric==='sales'?'Day total':'Orders per day'}</h3><svg viewBox="0 0 ${w} ${h}" style="width:100%;height:260px;display:block">${labels}<polyline points="${pts.join(' ')}" fill="none" stroke="#d4af37" stroke-width="4" stroke-linecap="round"/><polygon points="${area}" fill="rgba(212,175,55,.22)"/>${pts.map((pt,i)=>{const [x,y]=pt.split(',');return `<circle cx="${x}" cy="${y}" r="5" fill="#d4af37"/><text x="${x}" y="${h-10}" text-anchor="middle" font-size="12" fill="#8f846f">${rows[i]?shortDate(rows[i].key):''}</text>`}).join('')}</svg></section>`;
}

function escapeJS(v){return String(v||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');}

function setTableAuto(table,status){
  if(!table||table==='—'||table==='-')return;
  const t=findTableStatus(table);
  if(t){t.s=status;t.guest=status==='available'?0:(t.guest||2);} 
  const old=tables.find(x=>Number(x.n)===Number(String(table).replace(/^T/i,''))); if(old)old.occ=status==='occupied';
}
function syncTablesWithOrders(){
  const activeTables=new Set((orders||[]).filter(o=>o.type==='dine' && o.status!=='Paid' && o.table && o.table!=='—').map(o=>String(o.table).replace(/^T/i,'').padStart(2,'0')));
  safeTableList().forEach(t=>{const key=String(t.n).padStart(2,'0'); if(activeTables.has(key)){t.s='occupied';t.guest=t.guest||2;} else if(t.s==='occupied'){t.s='available';t.guest=0;}});
  (tables||[]).forEach(t=>{const key=String(t.n).padStart(2,'0'); t.occ=activeTables.has(key);});
}

function polishedLineGraph(rows,metric='sales'){
  const title=metric==='sales'?'Day total':'Orders per day';
  const vals=rows.length?rows.map(r=>Number(r[metric]||0)):[0];
  let max=Math.max(...vals,1); max=max===1?1:max*1.18;
  const w=1100,h=260,left=110,right=35,top=28,bottom=52,innerW=w-left-right,innerH=h-top-bottom;
  const xFor=i=>left+(rows.length<=1?innerW/2:i*innerW/(rows.length-1));
  const yFor=v=>top+innerH-(v/max)*innerH;
  const pts=vals.map((v,i)=>`${xFor(i)},${yFor(v)}`);
  const area=`${xFor(0)},${top+innerH} ${pts.join(' ')} ${xFor(vals.length-1)},${top+innerH}`;
  const labels=[1,.75,.5,.25,0].map(fr=>{const y=top+innerH-fr*innerH; const val=max*fr; return `<line x1="${left}" y1="${y}" x2="${w-right}" y2="${y}" stroke="rgba(0,0,0,.10)"/><text x="${left-18}" y="${y+4}" font-size="13" text-anchor="end" fill="#8f846f">${metric==='sales'?rm(val):Math.round(val)}</text>`;}).join('');
  const line=pts.length>1?`<polyline points="${pts.join(' ')}" fill="none" stroke="#d4af37" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`:`<line x1="${xFor(0)-80}" y1="${yFor(vals[0])}" x2="${xFor(0)+80}" y2="${yFor(vals[0])}" stroke="#d4af37" stroke-width="4" stroke-linecap="round"/>`;
  return `<section class="panel chart-panel" style="padding:18px"><h3 style="margin-bottom:10px">${title}</h3><svg viewBox="0 0 ${w} ${h}" style="width:100%;height:300px;display:block;overflow:visible">${labels}<polygon points="${area}" fill="rgba(212,175,55,.18)"/>${line}${pts.map((pt,i)=>{const [x,y]=pt.split(',');return `<circle cx="${x}" cy="${y}" r="6" fill="#d4af37" stroke="#fff" stroke-width="2"/><text x="${x}" y="${h-18}" text-anchor="middle" font-size="13" fill="#8f846f">${rows[i]?shortDate(rows[i].key):''}</text>`}).join('')}</svg></section>`;
}
simpleLineGraph=polishedLineGraph;
reportView=function(){const rows=groupSalesByDay(filteredSales(1));const total=rows.reduce((s,r)=>s+r.sales,0);const ordersCount=rows.reduce((s,r)=>s+r.orders,0);const avg=ordersCount?total/ordersCount:0;const best=rows.slice().sort((a,b)=>b.sales-a.sales)[0];return head('Sales Report','Smart POS · 1 day(s)','<button class="btn dark" onclick="window.print()">Download Report</button>')+`<section class="panel" style="padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap"><button class="chip gold">Today</button><button class="chip">Yesterday</button><button class="chip">Last 7 Days</button><button class="chip">This Month</button><button class="chip">Last Month</button><button class="chip">Custom</button></section>`+`<div class="stats"><div class="stat"><small>Total Sales</small><h2>${rm(total)}</h2></div><div class="stat"><small>Total Orders</small><h2>${ordersCount}</h2></div><div class="stat"><small>Avg Order</small><h2>${rm(avg)}</h2></div><div class="stat"><small>Best Day</small><h2>${best?`${shortDate(best.key)} · ${rm(best.sales)}`:'—'}</h2></div></div>`+polishedLineGraph(rows,'sales')+panelTable(['Date','Day','Orders','Avg/Order','Sales'],rows.map(r=>[shortDate(r.key),dayName(r.key),r.orders,rm(r.orders?r.sales/r.orders:0),`<b>${rm(r.sales)}</b>`]));};
analyticsView=function(){const rows=groupSalesByDay(filteredSales(7));const total=rows.reduce((s,r)=>s+r.sales,0);const count=rows.reduce((s,r)=>s+r.orders,0);const avg=count?total/count:0;const paid=filteredSales(7);const typeSum=t=>paid.filter(r=>(r.type||'take')===t).reduce((s,r)=>s+Number(r.sales||0),0);const dine=typeSum('dine'),take=typeSum('take'),del=typeSum('delivery');return head('Restaurant Analytics','Smart POS · Last 7 days')+`<div class="stats"><div class="stat"><small>Total Revenue</small><h2>${rm(total)}</h2></div><div class="stat"><small>Order Count</small><h2>${count}</h2></div><div class="stat"><small>Avg Order</small><h2>${rm(avg)}</h2></div><div class="stat"><small>Peak Time</small><h2>8 PM</h2></div></div>`+polishedLineGraph(rows,'orders')+panelTable(['Order Type','Share','Revenue'],[['Dine-In',total?Math.round((dine/total)*100)+'%':'0%',rm(dine)],['Takeaway',total?Math.round((take/total)*100)+'%':'0%',rm(take)],['Delivery',total?Math.round((del/total)*100)+'%':'0%',rm(del)]]);};


const _baseAppState=appState;
appState=function(){const st=_baseAppState();st.tableStatuses=tableStatuses;st.paymentMethods=paymentMethods;st.cashierShift=cashierShift;return st;};
const _baseApplyState=applyState;
applyState=function(s){_baseApplyState(s);if(Array.isArray(s?.tableStatuses))tableStatuses=s.tableStatuses;if(Array.isArray(s?.paymentMethods))paymentMethods=s.paymentMethods;if(s?.cashierShift)cashierShift={...cashierShift,...s.cashierShift};syncTablesWithOrders();};

  localStorage.setItem('POS_THEME',isLight?'light':'dark');
